<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLARE AI ♾️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050816;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;
 text-align:center;
 background:#101b35;
 border-bottom:2px solid #00d9ff;
}
header h1{color:#00e5ff;margin:0}
header p{color:#a9c5e8}
main{max-width:750px;margin:auto;padding:18px}
.panel{
 background:#101b35;
 padding:18px;
 border-radius:15px;
 margin-bottom:15px;
}
textarea{
 width:100%;
 height:110px;
 background:#071225;
 color:white;
 border:1px solid #00cfff;
 border-radius:10px;
 padding:12px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:10px;
 background:#00cfff;
 color:#00101c;
 border:0;
 border-radius:10px;
 font-weight:bold;
 font-size:16px;
}
#answer{
 white-space:pre-wrap;
 line-height:1.6;
 color:#d8edff;
}
footer{text-align:center;color:#829ab8;padding:20px}
</style>
</head>
<body><header>
<h1>FLARE AI ♾️</h1>
<p>Universal Intelligence System</p>
</header><main>
<div class="panel">
<h2>Ask FLARE</h2>
<textarea id="question" placeholder="Ask anything..."></textarea>
<button onclick="askFlare()">ACTIVATE FLARE</button>
</div><div class="panel">
<h2>FLARE Intelligence</h2>
<div id="answer">Greetings! I am FLARE AI. Ask me a question to begin.</div>
</div>
</main><footer>FLARE AI ♾️ | Universal Knowledge System</footer><script>
function askFlare(){
 const q=document.getElementById("question").value.trim();
 const a=document.getElementById("answer");

 if(!q){
  a.textContent="Please enter a question.";
  return;
 }

 a.textContent="FLARE is analysing your question...";

 setTimeout(()=>{
  a.textContent=
  "FLARE AI ANALYSIS\n\n"+
  "Your question: "+q+
  "\n\nI am currently running in basic offline mode. "+
  "My intelligent engines will be added in upcoming upgrades.";
 },500);
}
</script></body>
</html>
